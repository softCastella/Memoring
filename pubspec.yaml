name: memoring
description: "오늘의 할 일, 루틴, 마음 기록을 위한 감성 체크리스트 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  home_widget: ^0.8.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/Logo_Memoring.png
  fonts:
    - family: GowunBatang
      fonts:
        - asset: fonts/GowunBatang-Regular.ttf
          weight: 400
        - asset: fonts/GowunBatang-Bold.ttf
          weight: 700
